name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf libgtk-3-dev libvte-2.91-dev liblua5.3-dev libpcre2-dev xvfb

      - name: Build
        run: |
          autoreconf -fvi
          ./configure
          make
          make check

      - name: Run e2e
        run: xvfb-run -a ./src/tym -u ./lua/e2e.lua

      - name: Make dist tarball
        run: |
          make dist
          # fails when the tag does not match the version in configure.ac
          test -f "tym-${GITHUB_REF_NAME}.tar.gz"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "tym-${GITHUB_REF_NAME}.tar.gz" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
